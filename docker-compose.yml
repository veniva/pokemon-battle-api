services:
  api:
    build: .
    container_name: pokemon-game
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: pokemon-game-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  mongo_data: